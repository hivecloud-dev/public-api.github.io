components:
  schemas:
    AsyncTransactionStatus:
      type: string
      enum:
        - NOTSTARTED
        - EXECUTING
        - COMPLETE
    AsyncTransactionSuccessIndicator:
      type: string
      enum:
        - SUCCESS
        - ERROR
    AutorizadoXmlDto:
      type: object
      properties:
        id:
          type: string
        cpfCnpj:
          type: string
        tipoDocumento:
          $ref: '#/components/schemas/TipoDocumento'
    Banco:
      type: object
      properties:
        codigo:
          type: string
        nome:
          type: string
    CancelarMdfe:
      required:
        - idMdfeList
        - dataCancelamento
        - motivoCancelamento
      type: object
      properties:
        idMdfeList:
          type: array
          items:
            type: string
        dataCancelamento:
          type: string
          format: date-time
        motivoCancelamento:
          type: string
          minLength: 15
          maxLength: 255
    CancelarMdfeModal:
      type: object
      properties:
        id:
          type: string
        numero:
          type: integer
          format: int32
        serie:
          type: integer
          format: int32
        nomeMotorista:
          type: string
        status:
          $ref: '#/components/schemas/StatusMdfe'
    CancelarMdfeReturn:
      type: object
      properties:
        id:
          type: string
        sucesso:
          type: boolean
        mensagem:
          type: array
          items:
            type: string
        numero:
          type: integer
          format: int32
        serie:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/StatusMdfe'
    CargaLotacaoIntegracao:
      required:
        - LocalCarregamento
        - LocalDescarregamento
      type: object
      properties:
        LocalCarregamento:
          $ref: '#/components/schemas/LocalidadeCargaLotacaoIntegracao'
        LocalDescarregamento:
          $ref: '#/components/schemas/LocalidadeCargaLotacaoIntegracao'
    CategoriaCombinacaoVeicular:
      type: string
      enum:
        - EIXOS_2
        - EIXOS_3
        - EIXOS_4
        - EIXOS_5
        - EIXOS_6
        - EIXOS_7
        - EIXOS_8
        - EIXOS_9
        - EIXOS_10
        - EIXOS_ACIMA_10
    Certificado:
      type: object
      properties:
        validade:
          type: string
          format: date-time
        tipoCertificado:
          type: string
        token:
          type: string
        exibido30Dias:
          type: boolean
        exibido15Dias:
          type: boolean
        exibidoNoDia:
          type: boolean
        periodoValidadeCertificado:
          $ref: '#/components/schemas/PeriodoValidadeCertificado'
    Charset:
      type: object
      properties:
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        aliasSet:
          type: array
          items:
            type: string
          uniqueItems: true
    CiotDto:
      type: object
      properties:
        ciot:
          type: string
        situacao:
          $ref: '#/components/schemas/SituacaoCiot'
        isContingencia:
          type: boolean
    ComponentePagamentoFreteIntegracao:
      required:
        - tipoComponente
        - valor
      type: object
      properties:
        tipoComponente:
          $ref: '#/components/schemas/TipoComponenteIntegracao'
        valor:
          type: number
          format: double
