        \ CIOT montado e salvo junto ao MDF-e (ciotIntegracao, situacao\r\nEM_DIGITACAO).\
        \ Ainda nao emitido na e-Frete � sem {@code codigo}.\r\n- {@code ERRO}: nao\
        \ foi possivel emitir. {@code encaminhamento} indica se o\r\nproblema e falta\
        \ de informacao (volta para o CLIENTE) ou outro (OPERADOR).\r\nO MDF-e foi\
        \ criado sem CIOT e nao podera ser autorizado ate resolver."
