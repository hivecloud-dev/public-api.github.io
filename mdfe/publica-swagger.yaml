---
openapi: 3.0.3
info:
  title: Documentação da integração interna do MDFE
  description: Esta é a documentação das interfaces REST do MDFE
  contact:
    name: Equipe de desenvolvimento
    email: desenvolvimento@hivecloud.com.br
  version: 1.0
servers:
  - url: /mdfe/api
    description: Servidor Local com /mdfe
  - url: /api
    description: Servidor Local sem /mdfe
tags:
  - name: Central Emissao Mdfe
    description: "Endpoint facilitado de MDF-e da Central de Emissao.\r\n<p>\r\nEspelha\
      \ o {@code CentralEmissaoControllerImp} do CT-e: a criacao e separada da\r\n\
      emissao (este controller cria; o emitir-sincrono vem na fatia seguinte). O\r\
      \npayload e minimo ({@link com.hivelog.mdfe.rest.v1.dto.mdfe.integracao.MdfeCentralEmissaoDto})\
      \ e toda a orquestracao\r\n(derivacao dos CT-e, montagem do MdfeIntegracao,\
      \ geracao e CIOT) roda no service."
  - name: Integra Cancelar Mdfe
  - name: Integra Consultar Mdfe
  - name: Integra Emitir Mdfe
  - name: Integra Encerrar Mdfe
  - name: Integra Exportacao Mdfe
  - name: Integra Mdfe
  - name: Integra Mdfe
  - name: Integrar Empresas
  - name: Integrar Imprimir Documento Mdfe
paths:
  /v1/central-emissao/mdfe:
    post:
      tags:
        - Central Emissao Mdfe
      operationId: CentralEmissaoMdfeControllerImp.criarMdfe
      description: "Cria um MDF-e a partir de CT-e ja emitidos (rascunho, ainda nao\
        \ emitido)."
      parameters:
        - name: empresaId
          in: header
          required: true
          schema:
            type: string
        - name: body
          in: query
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                arquivos:
                  type: array
                  items:
                    type: string
                    format: binary
        description: XMLs de CT-e (opcional).
      responses:
        200:
          description: id do MDF-e criado + resultado do CIOT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriacaoMdfeFacilitadoResponseDto'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      x-operation-name: criarMdfe
  /v1/central-emissao/mdfe/emitir-sincrono:
    post:
      tags:
        - Central Emissao Mdfe
      operationId: CentralEmissaoMdfeControllerImp.emitirMdfeSincrono
      description: "Emite o MDF-e de forma \"sincrona\", espelhando o {@code /cte/emitir-sincrono}.\r\
        \nComo o motor do MDF-e e assincrono, o service faz polling interno: 200 com\
        \ o\r\nresultado quando conclui a tempo, 202 com o transactionId quando estoura\
        \ o\r\ntempo (a Central segue o acompanhamento)."
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmitirMdfeDto'
      responses:
        200:
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmissaoMdfeSincronaResponseDto'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
      x-operation-name: emitirMdfeSincrono
